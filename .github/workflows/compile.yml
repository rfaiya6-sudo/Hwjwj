name: Compile CLEO Script

on:
  push:
    paths:
      - '**.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile .txt to .csi
        run: |
          npx sanny compile SA.FirstPerson.txt --output SA.FirstPerson.csi --game sa_mobile

      - name: Upload .csi Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleo-compiled
          path: SA.FirstPerson.csi
