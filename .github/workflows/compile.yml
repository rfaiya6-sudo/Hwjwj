name: Compile CLEO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile
        run: |
          npx --yes @sannybuilder/cli compile SA.FirstPerson.txt -o SA.FirstPerson.csi -g sa_mobile

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cleo-compiled
          path: SA.FirstPerson.csi
